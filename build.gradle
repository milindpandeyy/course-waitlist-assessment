plugins {
    id 'java'
    id 'application'
}

application {
    // DESIGN.md section 13: interactive CLI, launched with ./gradlew run
    mainClass = 'com.assessment.enrollment.cli.EnrollmentCli'
}

tasks.named('run') {
    // Forward the console to the CLI's Scanner.
    standardInput = System.in
}

group = 'com.assessment'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    // DESIGN.md section 2: JDK 25 is a mandatory prerequisite.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
